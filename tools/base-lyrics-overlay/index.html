<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Base Lyrics Overlay v1 (Auto Demo)</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main id="stage" aria-label="Lyrics overlay">
    <div id="lyrics">
      <div id="linePrev" class="line muted"></div>
      <div id="lineNow" class="line now"></div>
      <div id="lineNext" class="line muted"></div>
    </div>

    <div id="brand">
      <span class="tag">TEXT &amp; DECKS</span>
      <span class="tag subtle">POWERED BY BASE</span>
    </div>
  </main>

  <!-- Controls exist but are hidden by default -->
  <section id="controls" class="hidden" aria-label="Controls">
    <div class="row">
      <label for="offsetMs">Sync Offset (ms):</label>
      <input id="offsetMs" type="range" min="-5000" max="5000" value="0" step="50" />
      <output id="offsetOut">0 ms</output>
      <button id="nudgeMinus">-100</button>
      <button id="nudgePlus">+100</button>
    </div>

    <div class="row">
      <button id="toggleControls">Show Controls</button>
      <button id="reset">Reset</button>
    </div>

    <div class="hint">
      OBS: Add this page as a <b>Browser Source</b>.
    </div>
  </section>

  <script src="player.js"></script>
</body>
</html>
